spring.application.name=library-backend
server.port=8080

# ---- Database connection (SQL via JDBC) ----
# File-based H2 database: the data survives restarts, stored in ./data/librarydb.
# To use MySQL instead, swap these four lines for your MySQL url/driver/username/password.
spring.datasource.url=jdbc:h2:file:./data/librarydb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql then data.sql on every startup (safe: uses CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 web console for viewing tables in the browser: http://localhost:8080/h2-console
# JDBC URL to paste in on the login page: jdbc:h2:file:./data/librarydb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Friendlier error bodies while developing
server.error.include-message=always
