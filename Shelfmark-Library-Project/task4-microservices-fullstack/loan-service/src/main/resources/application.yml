server:
  port: 8083

spring:
  application:
    name: loan-service
  datasource:
    url: jdbc:h2:file:./data/loandb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console

services:
  book-service:
    url: ${BOOK_SERVICE_URL:http://localhost:8081}
  member-service:
    url: ${MEMBER_SERVICE_URL:http://localhost:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
